name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Java 17 (Oracle JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '17'

      # 3. 设置 Android SDK 34 及所需组件
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 4. 下载 proot 二进制文件（来自 DSHA 仓库）
      - name: Download proot binaries from DSHA
        run: |
          JNIDIR="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNIDIR"
          BASE="https://raw.githubusercontent.com/qiannianhuanxiang/DSHA/main/app/src/main/jniLibs/arm64-v8a"
          for f in libproot.so libprootloader.so libprootloader32.so libtalloc.so libandroidshmem.so; do
            echo "Downloading $f ..."
            curl -fSL "$BASE/$f" -o "$JNIDIR/$f"
          done
          ls -la "$JNIDIR"

      # 5. 授予 gradlew 执行权限并构建 Debug APK
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 6. 上传 APK 作为构建产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error